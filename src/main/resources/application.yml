# =============================================================================
# Spring Fundamentals — application.yml
#
# YAML anchors (&) and aliases (*) are used to avoid repetition.
# Fill in values marked with <FILL_IN> before running the application.
# =============================================================================

# ---------------------------------------------------------------------------
# Reusable YAML anchors
# ---------------------------------------------------------------------------
_db_common: &db-common
  driver-class-name: org.postgresql.Driver
  hikari:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

_jpa_common: &jpa-common
  show-sql: true
  properties:
    hibernate:
      format_sql: true
      use_sql_comments: true
      jdbc:
        batch_size: 50
      order_inserts: true
      order_updates: true

# ---------------------------------------------------------------------------
# Application metadata
# ---------------------------------------------------------------------------
spring:
  application:
    name: spring-fundamentals

  # -------------------------------------------------------------------------
  # DataSource — PostgreSQL
  # -------------------------------------------------------------------------
  datasource:
    <<: *db-common
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spring_fundamentals_db}
    username: ${DB_USER:<FILL_IN>}
    password: ${DB_PASSWORD:<FILL_IN>}

  # -------------------------------------------------------------------------
  # JPA / Hibernate
  # -------------------------------------------------------------------------
  jpa:
    <<: *jpa-common
    hibernate:
      ddl-auto: validate          # Use 'create-drop' for local experiments; 'validate' for safety
    open-in-view: false           # Disable OSIV to avoid lazy-loading pitfalls

  # -------------------------------------------------------------------------
  # Jackson
  # -------------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.springfundamentals: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: DEBUG
    org.springframework.beans.factory: DEBUG

# ---------------------------------------------------------------------------
# OpenAPI / Springdoc
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ---------------------------------------------------------------------------
# Application-specific properties
# ---------------------------------------------------------------------------
app:
  openapi:
    dev-url: http://localhost:${server.port}

# =============================================================================
# Profiles
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    <<: *db-common
    url: jdbc:postgresql://localhost:5432/spring_fundamentals_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    <<: *jpa-common
    hibernate:
      ddl-auto: create-drop

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
